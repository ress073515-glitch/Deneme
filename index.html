<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazan Çıkla — Düşünceler & İzler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #faf9f7;
            --white: #ffffff;
            --ink: #1a1816;
            --ink2: #3d3b37;
            --muted: #888580;
            --dim: #b8b4ae;
            --border: #e8e4de;
            --accent: #c0392b;
            --serif: 'Libre Baskerville', Georgia, serif;
            --sans: 'DM Sans', sans-serif;
            --wide: 1100px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 300;
            line-height: 1.7;
            overflow-x: hidden;
        }

        #progress {
            position: fixed; top: 0; left: 0;
            height: 2px; width: 0%;
            background: var(--accent);
            z-index: 1000;
            transition: width 0.1s linear;
        }

        nav {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 100;
            height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px;
            background: rgba(250,249,247,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }
        .nav-logo span { color: var(--accent); }

        .hero {
            padding: 140px 40px 60px;
            max-width: var(--wide);
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
        }
        .hero-title {
            font-family: var(--serif);
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .hero-title em { font-style: italic; color: var(--muted); }

        main {
            max-width: var(--wide);
            margin: 0 auto;
            padding: 60px 40px 80px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 60px;
        }

        .post-card {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 32px;
            padding: 40px 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s;
        }
        .post-card:hover { opacity: 0.8; }
        .post-img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 2px;
            background: var(--border);
        }
        .post-cat {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }
        .post-title { font-family: var(--serif); font-size: 1.6rem; margin-bottom: 12px; line-height: 1.3; }
        .post-summary { font-size: 0.95rem; color: var(--muted); margin-bottom: 15px; }
        .post-date { font-size: 0.75rem; color: var(--dim); }

        .widget {
            border: 1px solid var(--border);
            padding: 24px;
            background: var(--white);
            margin-bottom: 32px;
            border-radius: 2px;
        }
        .widget-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--dim);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .widget-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .author-avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: var(--ink);
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--serif); font-size: 1.5rem; color: var(--white);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 2px;
            cursor: pointer;
            background: var(--bg);
        }
        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img { transform: scale(1.1); }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; padding: 40px 20px; }
            .post-card { grid-template-columns: 1fr; }
            .hero { padding: 120px 20px 40px; }
        }
    </style>
</head>
<body>

<div id="progress"></div>

<nav>
    <a href="#" class="nav-logo">Ramazan<span>.</span></a>
    <div style="font-size: 0.75rem; letter-spacing: 0.1em; color: var(--muted);">
        YAZILAR · HAKKIMDA · İLETİŞİM
    </div>
</nav>

<section class="hero">
    <p style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 15px;">Kişisel Günlük</p>
    <h1 class="hero-title">Düşünceler,<br><em>anlar</em> & izler.</h1>
    <p style="color: var(--muted); max-width: 450px; font-size: 1rem;">Teknoloji, sinema ve felsefe üzerine notlar. Kendi objektifimden karelerle harmanlanmış dijital bir alan.</p>
</section>

<main>
    <section id="posts-container"></section>

    <aside>
        <div class="widget">
            <p class="widget-title">Yazar</p>
            <div style="text-align: center;">
                <div class="author-avatar">R</div>
                <h3 style="font-family: var(--serif); font-size: 1.1rem; margin-bottom: 8px;">Ramazan Çıkla</h3>
                <p style="font-size: 0.85rem; color: var(--muted);">Teknoloji meraklısı, film analisti ve amatör fotoğrafçı.</p>
            </div>
        </div>

        <div class="widget">
            <p class="widget-title">Anlar / Galeri</p>
            <div class="gallery-grid" id="gallery-container"></div>
        </div>
    </aside>
</main>

<script>
    const POSTS = [
        {
            title: "Yıldızlara Neden Asla Gidemeyeceğiz?",
            summary: "Işık hızı duvarı karşısında insanlığın çaresizliğini ve teorik fiziğin bize sunduğu yeni kapıları aralıyoruz.",
            categories: ["Bilim", "Uzay"],
            image: "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?q=80&w=1000",
            date: "16 Nisan 2026",
            featured: true
        },
        {
            title: "Project Hail Mary: Bir Film Analizi",
            summary: "Sinemanın bilimle buluştuğu noktada Ryan Gosling'in performansı ve yalnızlık teması.",
            categories: ["Sinema", "Bilim"],
            image: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000",
            date: "10 Nisan 2026",
            featured: false
        }
    ];

    const PHOTOS = [
        "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400",
        "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=400",
        "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400",
        "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400"
    ];

    function init() {
        const postContainer = document.getElementById('posts-container');
        const galleryContainer = document.getElementById('gallery-container');

        postContainer.innerHTML = POSTS.map(p => `
            <article class="post-card">
                <img src="${p.image}" class="post-img" alt="${p.title}">
                <div>
                    <span class="post-cat">${p.categories.join(' · ')}</span>
                    <h2 class="post-title">${p.title}</h2>
                    <p class="post-summary">${p.summary}</p>
                    <div class="post-date">${p.date}</div>
                </div>
            </article>
        `).join('');

        galleryContainer.innerHTML = PHOTOS.map(img => `
            <div class="gallery-item">
                <img src="${img}" alt="Anlar" loading="lazy">
            </div>
        `).join('');

        window.addEventListener("scroll", () => {
            const s = window.scrollY, h = document.body.scrollHeight - window.innerHeight;
            const progress = document.getElementById("progress");
            if(progress) progress.style.width = (s/h*100)+"%";
        });
    }

    init();
</script>
</body>
</html>
