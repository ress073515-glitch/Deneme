<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazan Çıkla — Düşünceler & İzler</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #faf9f7;
            --white: #ffffff;
            --ink: #1a1816;
            --ink2: #3d3b37;
            --muted: #5a5854;
            --dim: #b8b4ae;
            --border: #e8e4de;
            --accent: #c0392b;
            --serif: 'Libre Baskerville', Georgia, serif;
            --sans: 'DM Sans', sans-serif;
            --wide: 1100px;
        }

        /* Temel Sıfırlama */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 300;
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Üst İlerleme Çubuğu */
        #progress {
            position: fixed; top: 0; left: 0;
            height: 3px; width: 0%;
            background: var(--accent);
            z-index: 1100;
            transition: width 0.1s linear;
        }

        /* Navigasyon */
        nav {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000;
            height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%;
            background: rgba(250,249,247,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            font-family: var(--serif);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
        }
        .nav-logo span { color: var(--accent); }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            font-weight: 500;
            text-transform: uppercase;
        }
        
        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            transition: color 0.3s ease;
        }
        
        .nav-links a:hover { color: var(--accent); }

        /* Hero (Giriş) Bölümü */
        .hero {
            padding: 160px 5% 80px;
            max-width: var(--wide);
            margin: 0 auto;
            border-bottom: 1px solid var(--border);
        }
        
        .hero-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            color: var(--accent);
            margin-bottom: 15px;
            font-weight: 600;
            display: block;
        }

        .hero-title {
            font-family: var(--serif);
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 25px;
        }
        .hero-title em { font-style: italic; color: var(--dim); }

        .hero-desc { color: var(--muted); max-width: 500px; font-size: 1.05rem; }

        /* Ana İçerik Dizilimi */
        main {
            max-width: var(--wide);
            margin: 0 auto;
            padding: 60px 5%;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 60px;
        }

        /* Yazı Kartları */
        .post-card {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 35px;
            padding: 45px 0;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s ease;
        }
        .post-card:first-child { padding-top: 0; }
        .post-card:hover { opacity: 0.85; }

        .post-img-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            border-radius: 4px;
        }

        .post-img {
            width: 100%; height: 100%;
            object-fit: cover;
            background: #eee;
        }

        .post-cat {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 12px;
            display: block;
        }

        .post-title { font-family: var(--serif); font-size: 1.7rem; margin-bottom: 15px; line-height: 1.3; }
        .post-summary { font-size: 0.95rem; color: var(--muted); margin-bottom: 20px; }
        .post-date { font-size: 0.75rem; color: var(--dim); }

        /* Yan Menü (Sidebar) */
        .widget {
            border: 1px solid var(--border);
            padding: 30px;
            background: var(--white);
            margin-bottom: 30px;
            border-radius: 4px;
        }
        
        .widget-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--dim);
            margin-bottom: 25px;
            display: flex; align-items: center; gap: 15px;
        }
        .widget-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .author-info { text-align: center; }
        .author-avatar {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: var(--ink);
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--serif); font-size: 1.8rem; color: var(--white);
        }

        /* Galeri */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .gallery-item {
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 3px;
            background: var(--bg);
        }
